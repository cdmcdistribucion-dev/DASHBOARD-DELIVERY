<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mi Ranking</title>
<style>
:root{
  --bg:#f2f2f3;--card:#fff;--tx:#2b2b2e;--tx2:#111;--mut:#6f6f76;--mut2:#9a9aa1;--line:#e6e6e9;
  --negro:#000;--amar:#f5b800;--verde:#1f7a35;
  --ok:#1f9d55;--warn:#e08a00;--bad:#d63c3c;--none:#b9b9bf;
  --sh:0 2px 10px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* barra superior */
.bar{background:var(--negro);border-bottom:4px solid var(--amar);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.bar b{color:#fff;font-size:17px;display:block}
.bar small{color:var(--amar);font-size:13px;display:block;margin-top:2px}
.ico{width:40px;height:40px;border-radius:10px;background:#2b2b2e;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.ico svg{width:20px;height:20px;stroke:#fff}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}
.eti{color:var(--verde);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
h1{margin:6px 0 4px;font-size:30px;line-height:1.15;color:var(--tx)}
.sub{color:var(--mut);font-size:15px;margin:0}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh)}
/* login */
.login .card{padding:18px;margin-top:22px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.field input{background:#f7f7f8;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:18px;outline:none;width:100%;color:var(--tx2)}
.field input:focus{border-color:var(--amar);background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin:2px 0 16px}
.btn{width:100%;border:2px solid var(--amar);border-radius:12px;padding:15px;background:var(--negro);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
/* filtros */
.per{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:20px;position:relative}
.per svg{width:24px;height:24px;stroke:var(--verde);flex:none}
.per .lb{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase}
.per select{border:0;background:transparent;font-weight:700;font-size:17px;color:var(--tx2);appearance:none;width:100%;padding:4px 22px 0 0;outline:none}
.per .chev{position:absolute;right:14px;top:50%;width:16px;height:16px;margin-top:-4px;stroke:var(--tx2)}
.per .in{flex:1;min-width:0}
.seg{display:flex;background:#e6e6e9;border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;color:var(--mut);cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:#fff;color:var(--tx2);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* posición */
.hero{margin-top:16px;background:var(--negro);border:2px solid var(--amar);border-radius:14px;padding:18px;color:#fff}
.hero .lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.hero .lbl svg{width:20px;height:20px;stroke:var(--amar)}
.pos{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.pos b{font-size:52px;line-height:1;color:var(--amar)}
.pos span{color:#cfcfd4;font-size:16px}
.hero .meta{font-size:14px;color:#cfcfd4}
.hero .meta b{color:#fff}
.sect{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sect .eti{font-size:11px}
.sect select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;max-width:60%;color:var(--tx2)}
.sect span.c{color:var(--mut);font-size:13px}
/* indicadores */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{padding:14px;position:relative;overflow:hidden}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--none)}
.k.ok::before{background:var(--ok)}.k.warn::before{background:var(--warn)}.k.bad::before{background:var(--bad)}
.k .n{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);line-height:1.3;min-height:26px}
.k .v{font-size:24px;font-weight:700;margin-top:6px;color:var(--tx2)}
.k .m{font-size:12px;color:var(--mut);margin-top:3px}
.k .m.ok{color:var(--ok)}.k .m.warn{color:var(--warn)}.k .m.bad{color:var(--bad)}
/* ranking */
.list{overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .p{font-weight:700;color:var(--mut2);text-align:center}
.row.top3 .p{color:#fff;background:var(--negro);border-radius:8px;padding:4px 0}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--mut);font-size:12px}
.row .val{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--tx2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.row.yo{background:#fff8dc;box-shadow:inset 4px 0 0 var(--amar)}
.row.yo .nm b::after{content:"  · Vos";color:#9a7400;font-size:12px}
.det{grid-column:1/-1;display:none;padding-top:8px}
.row.open .det{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.det div{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
.det div b{color:var(--tx2)}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px}
.nota{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<header class="bar">
  <div><b>Mi Ranking</b><small>CD Mercado Central · Distribución</small></div>
  <button class="ico hidden" id="btnSalir" aria-label="Salir"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
</header>
<div class="wrap">
  <section id="vLogin" class="login">
    <div class="eti">Ranking de choferes</div>
    <h1>Ingresá con tu DNI</h1>
    <p class="sub">Tus indicadores y tu posición en el ranking</p>
    <form class="card" id="frm" autocomplete="on">
      <div class="field"><label for="u">Usuario · tu DNI sin puntos</label><input id="u" inputmode="numeric" autocomplete="username" placeholder="30111222" required></div>
      <div class="field"><label for="c">Contraseña · primeros 3 dígitos del DNI</label><input id="c" type="password" inputmode="numeric" maxlength="3" autocomplete="current-password" placeholder="•••" required></div>
      <label class="chk"><input type="checkbox" id="rec" checked> Recordarme en este celular</label>
      <button class="btn" type="submit">Ingresar</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot" id="fLogin">Cargando datos…</div>
  </section>

  <section id="vApp" class="hidden">
    <div class="eti">Panel personal</div>
    <h1 id="hNom"></h1>
    <p class="sub" id="hOl"></p>
    <div class="seg" role="group" aria-label="Período" id="seg"><button data-t="mes">Mes</button><button data-t="semana">Semana</button><button data-t="dia">Día</button></div>
    <label class="card per" for="selPer">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      <div class="in"><div class="lb">Período consultado</div><select id="selPer"></select></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </label>
    <div class="hero" id="hero"></div>
    <div class="sect"><span class="eti">Mis indicadores</span></div>
    <div class="grid" id="misK"></div>
    <div class="sect"><span class="eti">Ranking</span><select id="selKpi" aria-label="Ordenar ranking por"></select></div>
    <div class="card list" id="lista"></div>
    <p class="nota" id="nota"></p>
  </section>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const nf = d => new Intl.NumberFormat('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmt = (k, v) => { if (v == null || !isFinite(v)) return '—'; if (k.fmt === 'cnt') return nf(0).format(Math.round(v)); const d = k.dec != null ? k.dec : (k.fmt === 'pct' ? 1 : 2); return k.fmt === 'pct' ? nf(d).format(v * 100) + '%' : nf(2).format(v); };
  const estado = (k, v) => { if (v == null || !isFinite(v) || k.meta == null) return 'none'; const t = k.tol || 0; if (k.mejor === 'bajo') return v <= k.meta ? 'ok' : v <= k.meta * (1 + t) ? 'warn' : 'bad'; return v >= k.meta ? 'ok' : v >= k.meta * (1 - t) ? 'warn' : 'bad'; };
  const TROFEO = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
  const TXT = { ok: 'En meta', warn: 'Cerca de la meta', bad: 'Fuera de meta', none: 'Sin meta' };
  const txtE = (k, v, s) => (v == null || !isFinite(v)) ? 'Sin datos' : TXT[s] + (k.meta != null ? ' · meta ' + fmt(k, k.meta) : '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  const normDni = v => { const d = String(v || '').replace(/\D/g, ''); return d || String(v || '').trim().toUpperCase(); };

  let D = null, yo = null, st = { t: 'mes', p: '', k: '', abierto: '' };

  function cargar() {
    const s = document.createElement('script');
    s.src = 'datos_app.js?t=' + Date.now();
    s.onload = () => { D = window.APP_DATOS; if (!D) return falla(); $('fLogin').textContent = 'Datos actualizados al ' + D.dataAl; auto(); };
    s.onerror = falla;
    document.head.appendChild(s);
  }
  function falla() { $('fLogin').textContent = 'No se pudieron cargar los datos. Revisá tu conexión y volvé a abrir.'; }

  async function entrar(dni, pass, recordar) {
    const d = normDni(dni), p = String(pass || '').trim();
    const dig = d.replace(/\D/g, '');
    if (!d || p.length !== 3 || p !== (dig || d).slice(0, 3)) return false;
    const h = (await sha('dimc:' + d)).slice(0, 20);
    if (!D.u.includes(h)) return 'nouser';
    yo = { h, nombre: D.n[h] && D.n[h][0], ol: D.n[h] && D.n[h][1] };
    if (recordar) ls.set('mrUser', JSON.stringify({ d, p })); else ls.set('mrUser', null);
    mostrarApp(); return true;
  }
  async function auto() { const g = ls.get('mrUser'); if (!g) return; try { const o = JSON.parse(g); const r = await entrar(o.d, o.p, true); if (r !== true) ls.set('mrUser', null); } catch (e) {} }

  $('frm').onsubmit = async e => {
    e.preventDefault(); $('err').textContent = '';
    if (!D) { $('err').textContent = 'Todavía se están cargando los datos.'; return; }
    const r = await entrar($('u').value, $('c').value, $('rec').checked);
    if (r === 'nouser') $('err').textContent = 'Ese DNI no figura en el ranking de este período.';
    else if (!r) $('err').textContent = 'Usuario o contraseña incorrectos.';
  };
  $('btnSalir').onclick = () => { ls.set('mrUser', null); yo = null; $('btnSalir').classList.add('hidden'); $('vApp').classList.add('hidden'); $('vLogin').classList.remove('hidden'); $('c').value = ''; };

  function periodos() { return D.periodos.filter(x => x.tipo === st.t); }
  function mostrarApp() {
    $('vLogin').classList.add('hidden'); $('vApp').classList.remove('hidden');
    $('hNom').textContent = 'Hola, ' + (yo.nombre || 'chofer'); $('hOl').textContent = (yo.ol || '') + ' · indicadores y ranking'; $('btnSalir').classList.remove('hidden');
    $('selKpi').innerHTML = D.kpis.map(k => `<option value="${k.id}">${esc(k.nombre)}</option>`).join('');
    st.k = st.k || D.rankDef || (D.kpis[0] && D.kpis[0].id); $('selKpi').value = st.k;
    pintarSeg(); llenarPer(); render();
  }
  function pintarSeg() { document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === st.t)); }
  function llenarPer() { const ps = periodos(); $('selPer').innerHTML = ps.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join(''); if (!ps.some(p => p.id === st.p)) st.p = ps[0] ? ps[0].id : ''; $('selPer').value = st.p; }
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { st.t = b.dataset.t; st.p = ''; pintarSeg(); llenarPer(); render(); });
  $('selPer').onchange = e => { st.p = e.target.value; render(); };
  $('selKpi').onchange = e => { st.k = e.target.value; render(); };

  function render() {
    const per = D.periodos.find(p => p.id === st.p && p.tipo === st.t);
    const ki = D.kpis.findIndex(k => k.id === st.k), k = D.kpis[ki];
    if (!per || !k) { $('hero').innerHTML = '<div class="empty">Sin datos para este período.</div>'; $('misK').innerHTML = ''; $('lista').innerHTML = ''; return; }
    /* ranking igual al del dashboard: choferes con el mínimo de viajes del período, ordenados por el KPI elegido */
    const filas = per.f.filter(r => r[3] >= per.min).map(r => ({ h: r[0], nom: r[1], ol: r[2], vj: r[3], v: r[4] }));
    filas.sort((a, b) => { const va = a.v[ki], vb = b.v[ki]; if (va == null) return 1; if (vb == null) return -1; return k.mejor === 'bajo' ? va - vb : vb - va; });
    filas.forEach((x, i) => x.pos = i + 1);
    const mio = filas.find(x => x.h === yo.h);
    const mioTodo = mio || (per.f.find(r => r[0] === yo.h) ? (r => ({ h: r[0], nom: r[1], ol: r[2], vj: r[3], v: r[4] }))(per.f.find(r => r[0] === yo.h)) : null);
    const e = mio ? estado(k, mio.v[ki]) : 'none';
    $('hero').innerHTML = mio
      ? `<div class="lbl">${TROFEO}Mi posición · ${esc(k.nombre)}</div><div class="pos"><b>#${mio.pos}</b><span>de ${filas.length}</span></div><div class="meta"><b>${fmt(k, mio.v[ki])}</b> · ${TXT[e]}${k.meta != null ? ' (meta ' + fmt(k, k.meta) + ')' : ''} · ${mio.vj} viajes</div>`
      : `<div class="lbl">${TROFEO}Mi posición · ${esc(k.nombre)}</div><div class="pos"><b>—</b></div><div class="meta">${mioTodo ? 'Tenés ' + mioTodo.vj + ' viajes: el ranking pide al menos ' + per.min + ' en este período.' : 'No tenés viajes en este período.'}</div>`;
    $('misK').innerHTML = mioTodo ? D.kpis.map((kk, j) => { const v = mioTodo.v[j], s = estado(kk, v); return `<div class="card k ${s}"><div class="n">${esc(kk.nombre)}</div><div class="v">${fmt(kk, v)}</div><div class="m ${s}">${txtE(kk, v, s)}</div></div>`; }).join('') : '<div class="empty" style="grid-column:1/-1">Sin datos tuyos en este período.</div>';
    
    $('lista').innerHTML = filas.length ? filas.map(x => { const s = estado(k, x.v[ki]); return `<div class="row${x.pos <= 3 ? ' top3' : ''}${x.h === yo.h ? ' yo' : ''}${st.abierto === x.h ? ' open' : ''}" data-h="${x.h}"><div class="p">${x.pos}</div><div class="nm"><b>${esc(x.nom)}</b><small>${esc(x.ol)} · ${x.vj} viajes</small></div><div class="val">${fmt(k, x.v[ki])}<i class="dot ${s}"></i></div><div class="det">${D.kpis.map((kk, j) => `<div><span>${esc(kk.nombre)}</span><b>${fmt(kk, x.v[j])}</b></div>`).join('')}</div></div>`; }).join('') : '<div class="empty">No hay choferes con el mínimo de viajes en este período.</div>';
    document.querySelectorAll('#lista .row').forEach(r => r.onclick = () => { st.abierto = st.abierto === r.dataset.h ? '' : r.dataset.h; render(); });
    $('nota').textContent = 'Datos al ' + D.dataAl + ' · ' + filas.length + ' choferes en el ranking · Ranking con choferes de al menos ' + per.min + ' viajes en el período, igual que en el tablero.';
    const yoRow = document.querySelector('#lista .row.yo'); if (yoRow && !render.scrolled) { render.scrolled = true; }
  }
  cargar();
})();
</script>
</body>
</html>
